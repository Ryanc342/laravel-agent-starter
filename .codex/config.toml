# Project settings for Codex. Codex reads AGENTS.md for instructions and
# .codex/agents/*.toml for the explorer and reviewer subagents.
[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@0.0.83", "--isolated"]

[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp"]
